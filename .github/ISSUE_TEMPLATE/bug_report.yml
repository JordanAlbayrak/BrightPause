name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open settings
        2. ...
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Settings, under Updates.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: input
    id: screens
    attributes:
      label: Number of screens
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else

[package]
name = "brightpause"
version = "1.0.0"
license = "MIT"
description = "A light break reminder"
edition = "2021"

[lib]
name = "brightpause_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = { version = "1", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_Foundation", "Win32_Globalization", "Win32_System_Registry", "Win32_System_Threading"] }

windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Foundation", "ApplicationModel", "Foundation", "UI_Shell"] }

[features]
# Microsoft Store build: the Store delivers updates, and start at login uses the package's startup task.
store = []

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
